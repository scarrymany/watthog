name: Идея
description: Предложить новую возможность или улучшение
title: "[идея] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Опишите ситуацию, в которой текущей функциональности не хватает.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предложение
      description: Как это могло бы работать.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Что пробовали вместо этого
