name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: сборка ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            console_built: dist/WattHog.exe
            console_asset: WattHog.exe
            gui_built: dist/WattHog-GUI.exe
            gui_asset: WattHog-GUI.exe
          - os: ubuntu-latest
            console_built: dist/WattHog
            console_asset: watthog-linux-x86_64
            gui_built: dist/WattHog-GUI
            gui_asset: watthog-gui-linux-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка Tk и виртуального экрана
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk xvfb

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Тесты (Linux, с виртуальным экраном)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Тесты (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

      - name: Сборка исполняемых файлов
        run: python -m PyInstaller --noconfirm --clean packaging/watthog.spec

      - name: Проверка сборки (Windows)
        if: runner.os == 'Windows'
        run: |
          ./dist/WattHog.exe --version
          ./dist/WattHog.exe run --duration 3 --interval 0.5 --plain --no-save
          if (-not (Test-Path ./dist/WattHog-GUI.exe)) { throw "оконная сборка не создана" }

      - name: Проверка сборки (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/WattHog dist/WattHog-GUI
          ./dist/WattHog --version
          ./dist/WattHog run --duration 3 --interval 0.5 --plain --no-save
          test -f dist/WattHog-GUI

      - name: Подготовка артефактов
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.console_built }}" "release/${{ matrix.console_asset }}"
          cp "${{ matrix.gui_built }}" "release/${{ matrix.gui_asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: публикация релиза
    runs-on: ubuntu-latest
    needs: build
    # Ручной запуск на ветке нужен для проверки сборки, а публиковать релиз
    # без тега некуда, поэтому этот шаг выполняется только по тегу.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Контрольные суммы
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
